[package]
authors = ["David Wallace Croft <david@CroftSoft.com>"]
categories = ["games", "simulation"]
description = "Evolve the movement of critters through food distribution"
edition = "2024"
homepage = "https://www.CroftSoft.com/"
keywords = ["evolution", "simulation"]
license = "MIT"
name = "com-croftsoft-app-evolve"
publish = false
readme = "README.md"
repository = "https://github.com/david-wallace-croft/com-croftsoft-app-evolve"
rust-version = "1.97"
version = "0.12.1-SNAPSHOT"

[dependencies]
anyhow = "~1.0.104"
com-croftsoft-lib-animation = "~0.0.8"
com-croftsoft-lib-role = "~0.5.1"
console_error_panic_hook = "~0.1.7"
futures = "~0.3.34"
js-sys = "~0.3.104"
wasm-bindgen = "~0.2.127"
wasm-bindgen-futures = "~0.4.77"

[dependencies.web-sys]
features = [
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlDivElement",
  "HtmlInputElement",
  "MouseEvent",
  "Performance",
  "Window",
  "console",
]
version = "~0.3.104"

[dev-dependencies]
wasm-bindgen-test = "~0.3.77"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
